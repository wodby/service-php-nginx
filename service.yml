name: php-nginx
title: Nginx (PHP)
type: service
from: nginx
fromVersionConstraint: "^2.0.0"
fromVersion: "2.0.1"
labels:
- nginx
- php

links:
- name: backend
  title: Backend
  required: true
  env:
  - name: NGINX_BACKEND_HOST
    value: '{{link.host}}'
  - name: NGINX_BACKEND_PORT
    value: '{{link.port}}'
  selectors:
  - type: service
    labels:
    - php-fpm

build:
  link: backend
  dockerfile: Dockerfile
  dockerignore: .dockerignore

settings:
- name: docroot
  title: Nginx docroot
  var: DOCROOT_SUBDIR
  default: public

env:
- name: NGINX_SERVER_ROOT
  value: /var/www/html/$(DOCROOT_SUBDIR)
- name: NGINX_VHOST_PRESET
  value: php

# Consumers share the source checkout's document root; uploads remain separate.
workspace:
  mounts:
  - name: code
    workload: main
    container: nginx
    path: '/var/www/html/{{settings.docroot}}'
    subPath: '{{settings.docroot}}'
    readOnly: true
  reload: immediate
